<!-- 
You are required to build a simple web app that can convert between different units of measurement.
It can convert units of length, weight, volume, area, temperature, and more.
The user can input a value and select the units to convert from and to. The application will then display the converted value.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="A simple and efficient unit converter web app to convert between length, weight, volume, cooking measurements, temperature, and more.">
    <meta name="keywords" content="unit converter, length converter, weight converter, volume converter, cooking converter, cups to grams, temperature converter, measurement converter">
    <meta name="author" content="Juan Franco">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Unit Converter">
    <meta property="og:description" content="Convert units of measurement easily with our Unit Converter web app.">
    <meta property="og:image" content="https://unit-converter-beryl-delta.vercel.app/assets/logoconverter.png">
    <meta property="og:url" content="https://unit-converter-beryl-delta.vercel.app/">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Unit Converter">
    <meta name="twitter:description" content="A simple and efficient unit converter web app to convert between different units of measurement.">
    <meta name="twitter:image" content="https://unit-converter-beryl-delta.vercel.app/assets/logoconverter.png">
    
    <!-- Favicon -->
    <link rel="icon" href="/assets/logo-160.png" type="image/png">

    <!-- fonts (self-hosted) -->
    <link rel="preload" href="./assets/fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- styles -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <img src="/assets/logo-160.png" alt="" width="80" height="80">
            <h1>Unit Converter</h1>
        </div>
    </header>
    <main>
        <h2>Convert Units of Measurement</h2>
        <p>Select a unit type to convert:</p>
        <div class="buttons" role="group" aria-label="Unit type">
            <button class="buttons-option" aria-pressed="false" aria-controls="component-container" data-converter="length">Length</button>
            <button class="buttons-option" aria-pressed="false" aria-controls="component-container" data-converter="weight">Weight</button>
            <button class="buttons-option" aria-pressed="false" aria-controls="component-container" data-converter="volume">Volume</button>
            <button class="buttons-option" aria-pressed="false" aria-controls="component-container" data-converter="cooking">Cooking</button>
            <button class="buttons-option" aria-pressed="false" aria-controls="component-container" data-converter="temperature">Temperature</button>
        </div>

        <div id="component-container"></div>
        <p id="status" class="visually-hidden" role="status"></p>

        <div id="result-container" role="region" aria-label="Result" tabindex="-1">
            <p id="result-text"></p>
            <button id="reset-button" type="button">Reset</button>
        </div>
    </main>

    <script src="./scripts/script.js"></script>
</body>
</html>
